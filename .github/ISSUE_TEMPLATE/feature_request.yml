# Modified for ForaOffice: integration surfaces and current editor scope.
name: Feature request
description: Suggest a new capability or an improvement
labels: [enhancement]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Docs SDK / host services
        - Docs live runtime / Harness / MCP
        - Docs standalone desktop
        - Inherited Sheets desktop
        - Inherited Slides desktop
        - Inherited PDF desktop
        - Inherited Markdown desktop
        - Inherited HTML desktop
        - Inherited shell / home screen
        - Inherited AI panel / providers
        - Whole suite
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Intended host or client
      description: Host type, automation mode, client/runtime versions and affected public interface, if applicable
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is currently hard or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Alternatives you considered are welcome too.
